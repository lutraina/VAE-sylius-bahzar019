stages:
  - deploy

variables:
  GIT_STRATEGY: fetch
  APP_ENV: int
  DATABASE_URL: 'mysql://silius_int:07taj5Q6!@localhost:3306/sylius_%kernel.environment%?serverVersion=8&charset=utf8mb4'

cache:
  paths:
    - vendor/
    - .composer/cache/

deploy_to_server:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client git  # Installer Git en plus du client SSH et ssh-keyscan
    - echo "$SSH_PRIVATE_KEY"
    - echo "🔍 Vérification des variables"
    - if [ -z "$SSH_PRIVATE_KEY" ]; then echo " La variable SSH_PRIVATE_KEY est vide ou non définie !"; exit 1; fi
    - echo "$SSH_PRIVATE_KEY"

  script:
    - echo "Début du déploiement..."
    - mkdir -p ~/.ssh            # Créer le répertoire .ssh si nécessaire
    - echo "$SSH_PRIVATE_KEY" > /root/.ssh/id_ed25519  # Ajouter la clé privée à ~/.ssh/id_ed25519
    - echo "$SSH_PRIVATE_KEY"
    - echo "cat clé /root/.ssh/id_ed25519"  
    - cat /root/.ssh/id_ed25519
      #- echo "$SSH_PRIVATE_KEY_BASE64" | base64 -d > ~/.ssh/id_ed25519
      #- echo "$SSH_PRIVATE_KEY_BASE64" 
    - echo "🔍 Contenu de la clé :"
    - cat /root/.ssh/id_ed25519  
    - chmod 600 /root/.ssh/id_ed25519    # Sécuriser les permissions de la clé privée
    - ssh-keyscan -H 74.208.127.40 >> /root/.ssh/known_hosts  # Ajouter l'hôte distant aux known_hosts
      #- eval $(ssh-agent -s)
      #- ssh-add /root/.ssh/id_ed25519
    - echo "$SSH_PRIVATE_KEY" > /root/.ssh/id_ed25519  # Ajouter la clé privée à ~/.ssh/id_ed25519
    - echo "$SSH_PRIVATE_KEY"
    - cat /root/.ssh/id_ed25519
    - echo "🔍 Contenu de la clé :"
    - cat /root/.ssh/id_ed25519

    # Définir la variable GIT_SSH_COMMAND avant d'exécuter git pull
    - export GIT_SSH_COMMAND="ssh -i /root/.ssh/id_ed25519"

    # Exécuter git pull en utilisant la clé privée via GIT_SSH_COMMAND
    - git pull origin master

    # Connexion SSH pour exécuter des commandes sur le serveur distant
    - echo "$SSH_PRIVATE_KEY" > /root/.ssh/id_ed25519
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_ed25519
    - ssh -v -i ~/.ssh/id_ed25519 root@74.208.127.40 "echo 'Connexion réussie' && cd /var/www/bahzar019.com && git pull origin master"
